name: Build STUDIO BHARAT X APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Studio Project
        run: |
          unzip -o "*.zip"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor 8 Android
        run: |
          npm install --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-community/text-to-speech@8
          npx cap add android || true
          npx cap sync android

      - name: Wire Native VedaAgent Plugin & Permissions
        run: |
          PKG_DIR="android/app/src/main/java/com/studiobharatx/veda"
          mkdir -p "$PKG_DIR" "android/app/src/main/res/xml"
          cp android-native/*.kt "$PKG_DIR/"
          cp android-native/accessibility_service_config.xml "android/app/src/main/res/xml/"
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.*" | head -n 1)
          if [ -n "$MAIN_ACT" ] && ! grep -q "VedaAgentPlugin" "$MAIN_ACT"; then
            sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(VedaAgentPlugin.class);\n        super.onCreate(savedInstanceState);/' "$MAIN_ACT" || true
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" "$MANIFEST" || sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.WRITE_SETTINGS" \/>\n    <application/' "$MANIFEST"
          grep -q "TopCapsuleService" "$MANIFEST" || sed -i 's/<\/application>/    <service android:name="com.studiobharatx.veda.TopCapsuleService" android:exported="false" \/>\n        <service android:name="com.studiobharatx.veda.VedaAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" \/><\/intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml\/accessibility_service_config" \/><\/service>\n    <\/application>/' "$MANIFEST"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-bharat-x-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
